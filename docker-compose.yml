services:
  kratos-migrate:
    image: oryd/kratos:v1.3.0
    environment:
      - DSN=postgres://kratos:secret@postgresd:5432/kratos?sslmode=disable&max_conns=20&max_idle_conns=4
    volumes:
      - type: bind
        source: ./config
        target: /etc/config/kratos
    command: migrate sql -e --yes
    restart: on-failure
    labels:
      logging: "promtail"
      logging_jobname: "containerlogs"
    networks:
      - intranet
  postgresd:
    image: postgres:16.4
    ports:
      - "5532:5432"
    environment:
      - POSTGRES_USER=kratos
      - POSTGRES_PASSWORD=secret
      - POSTGRES_DB=kratos
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - intranet
  kratos:
    container_name: kratos
    depends_on:
      - kratos-migrate
    image: oryd/kratos:v1.3.0
    ports:
      - "4433:4433" # public
      - "4434:4434" # admin
    restart: unless-stopped
    environment:
      - DSN=postgres://kratos:secret@postgresd:5432/kratos?sslmode=disable&max_conns=20&max_idle_conns=4
    command: serve -c /etc/config/kratos/kratos.yml --dev --watch-courier
    volumes:
      - type: bind
        source: ./config
        target: /etc/config/kratos
    labels:
      logging: "promtail"
      logging_jobname: "containerlogs"
    networks:
      - intranet
  mailslurper:
    image: oryd/mailslurper:latest-smtps
    ports:
      - "4436:4436"
      - "4437:4437"
    networks:
      - intranet

networks:
  intranet:
volumes:
  pgdata:
